apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
  namespace: enmaas
  labels:
    app.kubernetes.io/part-of: rhads-demo
    app.kubernetes.io/component: enmaas
    app.kubernetes.io/name: praxis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: rhads-demo
        app.kubernetes.io/component: enmaas
        app.kubernetes.io/name: praxis
    spec:
      containers:
        - name: praxis
          # Praxis AI gateway image (CNCF Sandbox). Pin/update as releases publish.
          image: ghcr.io/praxis-proxy/ai:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ENMAAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: enmaas-demo-key
                  key: api-key
            - name: PRAXIS_CONFIG
              value: /etc/praxis/praxis.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: praxis-config
