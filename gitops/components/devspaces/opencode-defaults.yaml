apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-enmaas-defaults
  namespace: openshift-devspaces
  labels:
    app.kubernetes.io/part-of: rhads-demo
    app.kubernetes.io/component: opencode
data:
  # Copied into AI coding workspaces via the opencode-enmaas software template
  # (.opencode/ and .devcontainer scripts). Cluster-wide defaults for docs/smoke.
  OPENCODE_MODEL: RedHatAI/Qwen3-8B-FP8-dynamic
  ENMAAS_BASE_URL: https://enmaas.CLUSTER_SUBDOMAIN_PLACEHOLDER/v1
  OPENSHELL_POLICY: rhads-opencode
  OPENSHELL_GATEWAY: https://openshell.CLUSTER_SUBDOMAIN_PLACEHOLDER
  README: |
    OpenCode in Dev Spaces uses EnMaaS (Praxis) as the OpenAI-compatible endpoint.
    Tool/network calls run under the OpenShell policy profile rhads-opencode.
