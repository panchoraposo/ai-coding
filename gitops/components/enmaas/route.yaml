apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: enmaas
  namespace: enmaas
  labels:
    app.kubernetes.io/part-of: rhads-demo
    app.kubernetes.io/component: enmaas
spec:
  host: enmaas.CLUSTER_SUBDOMAIN_PLACEHOLDER
  to:
    kind: Service
    name: praxis
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
