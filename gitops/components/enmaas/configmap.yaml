apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-config
  namespace: enmaas
  labels:
    app.kubernetes.io/part-of: rhads-demo
    app.kubernetes.io/component: enmaas
data:
  # Praxis AI filter-chain config (ghcr.io/praxis-proxy/ai). Routes /v1 to
  # in-cluster llm-d when present; /healthz is local so probes pass without RHOAI.
  praxis.yaml: |
    listeners:
      - name: ai
        address: "0.0.0.0:8080"
        filter_chains: [health, openai]

    filter_chains:
      - name: health
        filters:
          - filter: static_response
            conditions:
              - when:
                  path: /healthz
            status: 200
            body: '{"status":"ok","server":"praxis-ai"}'
            headers:
              - name: Content-Type
                value: application/json
      - name: openai
        filters:
          - filter: ai_operation
          - filter: router
            routes:
              - path_prefix: "/v1"
                cluster: openweight
          - filter: headers
            request_set:
              - name: Host
                value: llmd-openai.llmd.svc
          - filter: load_balancer
            clusters:
              - name: openweight
                endpoints:
                  - "llmd-openai.llmd.svc:8000"

    insecure_options:
      # Required to reach ClusterIP backends such as llm-d.
      allow_private_upstreams: true
