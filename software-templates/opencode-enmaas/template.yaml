apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: opencode-enmaas
  title: AI Coding App — OpenCode / MaaS
  description: "Quarkus service with Dev Spaces OpenCode prewired to your OpenAI-compatible MaaS (URL + API key + model), under OpenShell policy, plus the RHADS secure pipeline."
  tags:
    - recommended
    - quarkus
    - java
    - opencode
    - enmaas
    - maas
    - openshell
    - rhads
spec:
  owner: group:default/developers
  type: service
  parameters:
    - title: Application
      required: [component_id, owner]
      properties:
        component_id:
          title: Name
          type: string
          default: code-assist
          ui:field: EntityNamePicker
          maxLength: 18
        group_id:
          title: Maven Group Id
          type: string
          default: com.codeassist
        artifact_id:
          title: Maven Artifact Id
          type: string
          default: code-assist
        description:
          title: Description
          type: string
          default: AI Coding App (OpenCode + MaaS + OpenShell)
        owner:
          title: Owner
          type: string
          default: developers
    - title: MaaS (OpenAI-compatible)
      required: [maas_base_url, maas_model, maas_api_key]
      properties:
        maas_base_url:
          title: MaaS base URL
          type: string
          default: https://enmaas.CLUSTER_SUBDOMAIN_PLACEHOLDER/v1
          description: OpenAI-compatible base URL including /v1 (in-cluster Praxis or any external MaaS).
        maas_model:
          title: Model id
          type: string
          default: RedHatAI/Qwen3-8B-FP8-dynamic
          description: Exact model id your MaaS expects (as returned by GET /v1/models when available).
        maas_api_key:
          title: MaaS API key
          type: string
          ui:field: Secret
          description: Baked into the repo for Dev Spaces OpenCode automation (.opencode/maas.env, opencode.json, .devfile env).
    - title: Image registry
      required: [image_registry]
      properties:
        image_registry:
          title: Image Registry
          type: string
          enum: [Quay]
          default: Quay
        image_host:
          title: Quay host
          type: string
          default: QUAY_HOST_PLACEHOLDER
        image_tag:
          title: Image tag
          type: string
          default: latest
    - title: GitLab
      required: [repo, gitlab_group]
      properties:
        repo:
          title: Repository Location
          type: object
          properties:
            host:
              title: GitLab host
              type: string
              description: Hostname only (no https://). The scaffolder matches this against RHDH integrations.gitlab.host.
              default: GITLAB_HOST_PLACEHOLDER
        gitlab_group:
          title: GitLab group
          type: string
          default: developers
  steps:
    - id: template
      name: Fetch source skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          namespace: ${{ parameters.component_id }}-dev
          group_id: ${{ parameters.group_id }}
          artifact_id: ${{ parameters.artifact_id }}
          owner: ${{ parameters.owner }}
          gitlab_group: ${{ parameters.gitlab_group }}
          host: ${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}
          destination: ${{ parameters.gitlab_group }}/${{ parameters.component_id }}
          gitops_namespace: openshift-gitops
          cluster_subdomain: CLUSTER_SUBDOMAIN_PLACEHOLDER
          image_organization: rhads
          port: 8080
          maas_base_url: ${{ parameters.maas_base_url }}
          maas_model: ${{ parameters.maas_model }}
          maas_api_key: ${{ secrets.maas_api_key }}
        targetPath: ./${{ parameters.gitlab_group }}-${{ parameters.component_id }}
    - id: publish
      name: Publish source to GitLab
      action: publish:gitlab
      input:
        repoUrl: "${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}?owner=${{ parameters.gitlab_group }}&repo=${{ parameters.component_id }}"
        repoVisibility: public
        defaultBranch: main
        sourcePath: ./${{ parameters.gitlab_group }}-${{ parameters.component_id }}
        settings:
          auto_devops_enabled: false
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
    - id: template-gitops
      name: Generate GitOps (app of apps)
      action: fetch:template
      input:
        url: ./manifests
        values:
          component_id: ${{ parameters.component_id }}
          source_repository_gitops: https://${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}/${{ parameters.owner }}/${{ parameters.component_id }}-gitops.git
          source_repository: https://${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}/${{ parameters.gitlab_group }}/${{ parameters.component_id }}.git
          owner: ${{ parameters.owner }}
          namespace: ${{ parameters.component_id }}-dev
          image_registry: ${{ parameters.image_registry }}
          image_host: ${{ parameters.image_host }}
          image_organization: rhads
          image_password: backstage
          image_name: ${{ parameters.component_id }}
          image_tag: ${{ parameters.image_tag }}
          gitops_namespace: openshift-gitops
          gitops_project: default
          port: 8080
          cluster_subdomain: CLUSTER_SUBDOMAIN_PLACEHOLDER
          repository_host: ${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}
          dockerfile: ./src/main/docker/Dockerfile.jvm
          build_language: maven
          maas_base_url: ${{ parameters.maas_base_url }}
          maas_model: ${{ parameters.maas_model }}
          maas_api_key: ${{ secrets.maas_api_key }}
        targetPath: ./${{ parameters.owner }}-${{ parameters.component_id }}-gitops
    - id: publish-gitops
      name: Publish GitOps repository
      action: publish:gitlab
      input:
        repoUrl: "${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}?owner=${{ parameters.owner }}&repo=${{ parameters.component_id }}-gitops"
        repoVisibility: public
        defaultBranch: main
        sourcePath: ./${{ parameters.owner }}-${{ parameters.component_id }}-gitops
        settings:
          auto_devops_enabled: false
    - id: create-argocd
      name: Create Argo CD app-of-apps
      action: backstage-community-argocd:create-resources
      input:
        appName: ${{ parameters.component_id }}-bootstrap
        argoInstance: main
        namespace: openshift-gitops
        repoUrl: https://${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}/${{ parameters.owner }}/${{ parameters.component_id }}-gitops.git
        path: argocd/
  output:
    links:
      - title: Source repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
