apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-config
  namespace: enmaas
  labels:
    app.kubernetes.io/part-of: rhads-demo
    app.kubernetes.io/component: enmaas
data:
  # Minimal Praxis AI-style gateway config. Routes Chat Completions to in-cluster
  # llm-d. Optional frontier backends can be added under backends.commercial.
  praxis.yaml: |
    listeners:
      - name: openai
        address: 0.0.0.0
        port: 8080
    auth:
      api_keys:
        - env: ENMAAS_API_KEY
    backends:
      openweight:
        type: openai_chat_completions
        base_url: http://llmd-openai.llmd.svc:8000/v1
        model: RedHatAI/Qwen3-8B-FP8-dynamic
      # commercial:
      #   type: openai_chat_completions
      #   base_url: https://api.openai.com/v1
      #   api_key_env: OPENAI_API_KEY
    routing:
      default_backend: openweight
      models:
        - match: RedHatAI/Qwen3-8B-FP8-dynamic
          backend: openweight
        - match: "*"
          backend: openweight
    metering:
      enabled: true
      log_tokens: true
    rate_limit:
      requests_per_minute: 120
