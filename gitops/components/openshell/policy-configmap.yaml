apiVersion: v1
kind: ConfigMap
metadata:
  name: rhads-opencode-policy
  namespace: openshell
  labels:
    app.kubernetes.io/part-of: rhads-demo
    app.kubernetes.io/component: openshell-policy
  annotations:
    rhads.demo/description: >
      Demo OpenShell policy profile for OpenCode. Allows egress to EnMaaS,
      GitLab, Quay, Nexus, Dev Spaces, and cluster DNS. Denies everything else.
data:
  policy.yaml: |
    apiVersion: openshell.dev/v1alpha1
    kind: AgentPolicy
    metadata:
      name: rhads-opencode
    spec:
      filesystem:
        readWrite:
          - /workspace
          - /tmp
        readOnly:
          - /etc/ssl
          - /etc/pki
      network:
        allow:
          - host: enmaas.CLUSTER_SUBDOMAIN_PLACEHOLDER
            ports: [443, 80]
          - host: gitlab.CLUSTER_SUBDOMAIN_PLACEHOLDER
            ports: [443, 80]
          - host: quay.CLUSTER_SUBDOMAIN_PLACEHOLDER
            ports: [443, 80]
          - host: nexus.CLUSTER_SUBDOMAIN_PLACEHOLDER
            ports: [443, 80]
          - host: rhdh.CLUSTER_SUBDOMAIN_PLACEHOLDER
            ports: [443, 80]
          - host: "*.svc"
            ports: [80, 443, 8080, 8081, 9092]
          - host: kubernetes.default.svc
            ports: [443]
          - host: "192.168.0.0/16"
            ports: [53]
          - host: "10.0.0.0/8"
            ports: [53]
        deny:
          - host: "*"
      credentials:
        injectOnAllowlistOnly: true
