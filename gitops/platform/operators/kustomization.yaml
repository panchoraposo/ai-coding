apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace-pipelines.yaml
  - namespace-rhdh.yaml
  - namespace-devspaces.yaml
  - namespace-keycloak.yaml
  - namespace-quay.yaml
  - namespace-rhtas.yaml
  - namespace-rhtpa.yaml
  - namespace-rhacs.yaml
  - namespace-odf.yaml
  - namespace-ci.yaml
  - namespace-eso.yaml
  - namespace-kafka.yaml
  - namespace-kafka-console.yaml
  - namespace-coo.yaml
  - namespace-apicurio.yaml
  - namespace-debezium.yaml
  - namespace-openshell.yaml
  - namespace-enmaas.yaml
  - namespace-llmd.yaml
  - namespace-rhoai.yaml
  - namespace-agent-sandbox.yaml
  - operatorgroup-eso.yaml
  - subscription-eso.yaml
  # OwnNamespace operators
  # External Secrets Operator for Red Hat OpenShift (stable-v1) is installed
  # in external-secrets-operator; the operand runs in external-secrets.
  # RHBK OperatorGroup + Subscription stay out of this kustomization.
  # Workshop clusters already run Keycloak (realm `sso`) for OpenShift login;
  # Ansible installs RHBK only when that SSO is absent.
  #
  # RHTPA + OpenShift AI (rhods) Subscriptions are applied by Ansible after
  # catalog detection (redhat-operators or AgnosticD rhbk-operator-catalogsource).
  # Keep namespaces / OperatorGroups here so targets exist either way.
  - operatorgroup-quay.yaml
  - operatorgroup-rhtpa.yaml
  - operatorgroup-rhoai.yaml
  - operatorgroup-kafka-console.yaml
  - operatorgroup-coo.yaml
  - operatorgroup-apicurio.yaml
  # ODF OperatorGroup + odf-operator Subscription stay out of this kustomization.
  # Workshop clusters already run external ODF; Ansible installs ODF only when absent.
  # AllNamespaces operators (RHDH, RHTAS, RHACS, Pipelines, Dev Spaces, AMQ Streams)
  # subscribe in openshift-operators — do not create namespaced OperatorGroups.
  - subscription-pipelines.yaml
  - subscription-rhdh.yaml
  - subscription-devworkspace.yaml
  - subscription-devspaces.yaml
  - subscription-quay.yaml
  - subscription-rhtas.yaml
  - subscription-rhacs.yaml
  - subscription-amq-streams.yaml
  - subscription-amq-streams-console.yaml
  - subscription-coo.yaml
  - subscription-apicurio.yaml
  # User-workload Prometheus scrapes ServiceMonitors from the app templates
  # and the Kafka exporter. Thanos Querier then serves them to Perses.
  - cluster-monitoring-config.yaml
